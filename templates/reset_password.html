<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restablecer Contraseña | Escuela Enrique Pinto Fernández</title>
    <link href="https://googleapis.com" rel="stylesheet" />
    <link href="https://jsdelivr.net" rel="stylesheet" />
    <link href="https://jsdelivr.net" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='sass/style.css') }}" />
  </head>

  <body class="login-page">
    <main class="login">
      <section class="login__form-container" style="margin: 0 auto; width: 100%; max-width: 450px;">
        <div class="login__form-wrapper" style="background: #059ac7; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
          
          <div class="login__form-header">
            <span> Seguridad Institucional </span>
            <h2>Nueva Contraseña</h2>
            <p>Ingresa la nueva clave para tu cuenta de la plataforma educativa.</p>
          </div>

          <!-- Formulario -->
          <form id="resetPasswordForm" class="login-form" action="{{ url_for('restablecer', token=token) }}" method="POST">
            
            <div class="form-group">
              <label for="password"> Nueva Contraseña </label>
              <div class="input-wrapper">
                <i class="ri-lock-2-line"></i>
                <input type="password" id="password" name="password" placeholder="Escribe tu nueva clave" required />
              </div>
            </div>

            <button type="submit" class="btn login-form__submit" style="margin-top: 1.5rem; width: 100%;">
              <span> Guardar</span>
              <i class="ri-arrow-right-line"></i>
            </button>
          </form>

        </div>
      </section>
    </main>
  </body>
</html>
