<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Contraseña | Escuela Enrique Pinto Fernández</title>
    <link href="https://googleapis.com" rel="stylesheet" />
    <link href="https://jsdelivr.net" rel="stylesheet" />
    <link href="https://jsdelivr.net" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='sass/style.css') }}" />
  </head>

  <body class="login-page">
    <main class="login">
      <section class="login__form-container" style="margin: 0 auto; width: 100%; max-width: 450px;">
        <div class="login__form-wrapper" style="background: #059ac7; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
          
          <a href="{{ url_for('login') }}" class="login__back" style="color: #000000; text-decoration: none; font-size: 0.9rem; display: inline-block; margin-bottom: 1.5rem;">
            <i class="ri-arrow-left-line"></i> Volver al login
          </a>

          <div class="login__form-header">
            <span> Seguridad Virtual </span>
            <h2>Recuperar acceso</h2>
            <p>Ingresa tu correo institucional. Si existe en el sistema, podrás asignar una nueva contraseña de inmediato.</p>
          </div>

          <!-- Formulario -->
          <form id="forgotPasswordForm" class="login-form" action="{{ url_for('recuperar') }}" method="POST">
            <div class="form-group">
              <label for="email"> Correo electrónico </label>
              <div class="input-wrapper">
                <i class="ri-mail-line"></i>
                <input type="email" id="email" name="email" placeholder="Ingresa tu correo institucional" required />
              </div>
            </div>

            <button type="submit" class="btn login-form__submit" style="margin-top: 1.5rem; width: 100%;">
              <span> Verificar Correo </span>
              <i class="ri-arrow-right-line"></i>
            </button>
          </form>

        </div>
      </section>
    </main>
  </body>
</html>
